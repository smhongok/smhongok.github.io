name: Build All CV PDFs

on:
  workflow_dispatch:
  push:
    paths:
      - 'CV_SMH.tex'
      - 'CV_preamble.tex'
      - 'CV_body.tex'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compile all CV PDFs
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            CV_SMH.tex
          latexmk_use_pdflatex: true

      - name: Move PDFs to files/
        run: |
          mv CV_SMH.pdf files/CV_smhong.pdf
      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files/CV_smhong.pdf
          git diff --cached --quiet || git commit -m "chore: rebuild all CV PDFs"
          git push
